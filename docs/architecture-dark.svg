<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" role="img" aria-label="BookRead architecture: Mobile App and Web Backoffice connect over REST/JWT to the BookRead API, which persists to PostgreSQL via Sequelize.">
  <defs>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(191,192,192,0.7)"/>
    </marker>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #f5f5f5; text-anchor: middle; }
    .sub  { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; fill: #bfc0c0; text-anchor: middle; }
    .eyebrow { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8px; font-weight: 500; fill: #8e98ac; letter-spacing: 1.5px; }
    .lbl  { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8px; fill: #8e98ac; text-anchor: middle; letter-spacing: 0.3px; }
  </style>

  <rect x="0" y="0" width="640" height="400" rx="8" fill="#2d3142" stroke="rgba(191,192,192,0.35)" stroke-width="1"/>

  <text x="24" y="30" class="eyebrow">ARCHITECTURE</text>
  <line x1="24" y1="40" x2="616" y2="40" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>

  <!-- connectors (drawn first, sit behind nodes) -->
  <path d="M186,136 L186,164 L320,164 L320,204" fill="none" stroke="rgba(191,192,192,0.45)" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow-d)"/>
  <path d="M454,136 L454,164 L320,164 L320,204" fill="none" stroke="rgba(191,192,192,0.45)" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow-d)"/>
  <path d="M320,280 L320,324" fill="none" stroke="rgba(191,192,192,0.45)" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow-d)"/>

  <rect x="284" y="150" width="72" height="14" rx="3" fill="#2d3142"/>
  <text x="320" y="160" class="lbl">REST · JWT</text>

  <rect x="296" y="296" width="48" height="14" rx="3" fill="#2d3142"/>
  <text x="320" y="306" class="lbl">SQL</text>

  <!-- tier 1: clients -->
  <rect x="76" y="64" width="220" height="72" rx="6" fill="#393e53" stroke="rgba(191,192,192,0.35)" stroke-width="1"/>
  <text x="186" y="98" class="name">Mobile App</text>
  <text x="186" y="116" class="sub">Flutter</text>

  <rect x="344" y="64" width="220" height="72" rx="6" fill="#393e53" stroke="rgba(191,192,192,0.35)" stroke-width="1"/>
  <text x="454" y="98" class="name">Web Backoffice</text>
  <text x="454" y="116" class="sub">Next.js · TypeScript</text>

  <!-- tier 2: backend (focal node) -->
  <rect x="180" y="208" width="280" height="72" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.4"/>
  <text x="320" y="242" class="name">BookRead API</text>
  <text x="320" y="260" class="sub">Express · JWT Auth</text>

  <!-- tier 3: data -->
  <rect x="220" y="328" width="200" height="56" rx="6" fill="#393e53" stroke="rgba(191,192,192,0.35)" stroke-width="1"/>
  <text x="320" y="356" class="name">PostgreSQL</text>
  <text x="320" y="370" class="sub">via Sequelize</text>
</svg>
