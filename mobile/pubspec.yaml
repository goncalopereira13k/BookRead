name: bookread
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.4.0
  http: ^1.3.0
  duration_picker:
    git: https://github.com/drcor/duration_picker.git
  flutter_local_notifications: ^19.1.0
  provider: ^6.1.4
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  font_awesome_flutter: ^10.6.0
  googleapis: ^14.0.0
  material_symbols_icons: ^4.2815.0
  flutter_secure_storage: ^9.2.4
  mockito: ^5.4.6
  language_picker: ^0.4.5
  workmanager: ^0.6.0
  path_provider: ^2.1.5
  docx_template_fork: ^0.5.0
  permission_handler: ^12.0.0+1
  package_info_plus: ^8.3.0
  flutter_slidable: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/i18n/
    - assets/templates/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
